# CP70073O marking criteria.
#
# PROVENANCE — three different things are recorded here, and they are not equally
# authoritative. Do not let the third read as the first.
#
#   `criteria`             VERBATIM from sources/university/MSc Dissertation Marking
#                          Criteria (1).pdf. Names, descriptors and sub-weightings are
#                          quoted exactly. The rubric is criterion-based and says
#                          NOTHING about chapters, ordering, or which chapter carries
#                          which criterion.
#   `mandated_structure`   VERBATIM requirement list from the MSG (a different
#                          document), which does specify the chapter sequence.
#   `evidence`, `must_contain`, `word_budget`
#                          OUR MAPPING. Not from either source. A working assignment of
#                          where each criterion's evidence is expected to appear, used
#                          to drive check_rubric_trace.py. Markers award against criteria
#                          wherever the evidence is found, so this is a drafting aid, not
#                          a constraint the university imposes.
#
# Notably inferred: Analysis and Conclusions (15) is split here as one 5-mark block in
# the Results chapter (critical evaluation of results) and two in the Conclusion
# (contributions; limitations and future work). The rubric states the three blocks and
# does not say where they appear.
#
# check_rubric_trace.py fails if any criterion has no non-stub evidence file.
total: 100

# ---------------------------------------------------------------------------
# BLACKBOARD RUBRIC — the instrument the marker actually scores with.
# Extracted 29 Aug 2026 from sources/university/BlackBordRubricDetails.html
# into canon/rubric_bands.yaml (verbatim descriptors, four bands per criterion).
#
# TWO FACTS THAT CHANGE HOW MARKING WORKS, and that this file previously had wrong:
#
# 1. SCORING IS BANDED, NOT CONTINUOUS. Each criterion scores exactly one of
#    Excellent / Satisfactory / Unsatisfactory / Poor — for a 10-mark criterion
#    that is 10, 7.5, 5 or 2.5. There is no 8.5 and no 9. Every mark this project
#    recorded before 29 Aug (8.5, 8.0, 7) is unattainable. The only question a
#    marker answers is WHICH BAND, and for this work the live question is almost
#    always Excellent vs Satisfactory — a 2.5-mark step per criterion, 25 marks
#    across the whole submission.
#
# 2. THE SUB-ITEM SPLITS BELOW ARE NOT IN THE BLACKBOARD RUBRIC. The 20/15 split
#    of Results, and the 5/5 and 5/5/5 splits elsewhere, come from the marking
#    criteria PDF. Blackboard scores Results as ONE 35-mark criterion. Treat the
#    sub-items as what the descriptor covers, never as separately scorable parts.
#
# Where the two instruments differ, the Blackboard bands govern the score and the
# PDF sub-items govern what evidence the band descriptor is judged on.
# ---------------------------------------------------------------------------
submission:
  dissertation_deadline: 2026-09-20
  oral_date: 2026-09-25
  oral_time: "10:00"
  oral_mode: in person
  oral_length_min: 12
  oral_qa_min: 3
  source: Course Announcement, Dissertation Submission
  note: |
    Announced deadline is 20 September, NOT the 28 September carried in the
    proposal and in this repo until 29 August. The buffer behind the 8 September
    working target is 12 days, not 20. The oral falls AFTER submission, so the
    dissertation is fixed before the presentation is given.
  declaration_required: |
    "a signed Declaration affirming that the work is your own, except where
    explicitly referencing the contributions of others (including AI)"
  emphasis: |
    "Key Assessment Components: The pivotal section is the Results, accounting
    for 35% of the assessment."
  oral_mandated_sections:
    - Title
    - Summary of Related Literature Survey
    - Aims and Objectives
    - Experimental Setup
    - Results & Findings
    - Conclusions (including potential limitations)

band_source: canon/rubric_bands.yaml
scoring: banded
bands_per_criterion: [excellent, satisfactory, unsatisfactory, poor]
band_fractions: {excellent: 1.0, satisfactory: 0.75, unsatisfactory: 0.5, poor: 0.25}

criteria:
- id: aims
  name: Aims and Objectives
  marks: 10
  descriptor_verbatim: Background and context of the research area / topic well introduced. Research question(s)
    clearly defined, and appropriate for Master level. (5) Aims and objectives clearly defined; hypothesis
    well-formulated; expected research output and deliverables are specific, measurable and achievable.
    (5)
  sub:
  - marks: 5
    text: Background and context of the research area / topic well introduced. Research question(s) clearly
      defined, and appropriate for Master level.
  - marks: 5
    text: Aims and objectives clearly defined; hypothesis well-formulated; expected research output and
      deliverables are specific, measurable and achievable.
  evidence:
  - dissertation/01_introduction.md
  must_contain:
  - hypothesis
  - objective
  - research question
  - deliverable
- id: litreview
  name: Literature Review
  marks: 10
  descriptor_verbatim: In-depth and quality review of related work supported by sufficient, appropriate
    and relevant literature. (5) Gap analysis and motivation / importance of proposed research well addressed
    through analysis, evaluation and synthesis of related literature. (5)
  sub:
  - marks: 5
    text: In-depth and quality review of related work supported by sufficient, appropriate and relevant
      literature.
  - marks: 5
    text: Gap analysis and motivation / importance of proposed research well addressed through analysis,
      evaluation and synthesis of related literature.
  evidence:
  - dissertation/02_literature_review.md
  must_contain:
  - gap
  - since literature review
- id: methods
  name: Methodology and Approach
  marks: 10
  descriptor_verbatim: Research design and process described in detail (e.g. experiment design, survey
    / interview design, data collection, procedure description, etc.) (5) Chosen method/approach well-articulated
    and justified in the specific context of the research. (5)
  sub:
  - marks: 5
    text: Research design and process described in detail (e.g. experiment design, survey / interview
      design, data collection, procedure description, etc.)
  - marks: 5
    text: Chosen method/approach well-articulated and justified in the specific context of the research.
  evidence:
  - dissertation/03_methods.md
  must_contain:
  - justif
  - pre-registration
  - AutoDojo
  - ethic
- id: results
  name: Results and Findings
  marks: 35
  descriptor_verbatim: Presence and evidence of main research output (e.g. new theory, design and methodology,
    new technical solutions such as algorithms, architectures, conceptual / analytic models, software
    artefacts, etc.) (20) Statement and description of data collected and results; descriptive summary
    of findings. (15)
  sub:
  - marks: 20
    text: Presence and evidence of main research output (e.g. new theory, design and methodology, new
      technical solutions such as algorithms, architectures, conceptual / analytic models, software artefacts,
      etc.)
  - marks: 15
    text: Statement and description of data collected and results; descriptive summary of findings.
  evidence:
  - dissertation/04_results_discussion.md
  must_contain:
  - Research output
  - Table
  - Figure
- id: analysis
  name: Analysis and Conclusions
  marks: 15
  descriptor_verbatim: Summary of contributions; sound conclusions drawn and supported by analysis. (5)
    Critical analysis, exploration and evaluation of data collected / results generated. (5) Limitation
    and implication / impact of research discussed. Reflection and identification of improvements / future
    work. (5)
  sub:
  - marks: 5
    text: Summary of contributions; sound conclusions drawn and supported by analysis.
  - marks: 5
    text: Critical analysis, exploration and evaluation of data collected / results generated.
  - marks: 5
    text: Limitation and implication / impact of research discussed. Reflection and identification of
      improvements / future work.
  evidence:
  - dissertation/04_results_discussion.md
  - dissertation/05_conclusion.md
  must_contain:
  - limitation
  - future work
  - contribution
- id: oral
  name: Oral Defence
  marks: 20
  descriptor_verbatim: Oral presentation given by the student and Q&A conducted (separate marking form).
  evidence:
  - dissertation/oral/OUTLINE.md
  must_contain:
  - future work
  - results

# Oral presentation. VERBATIM from sources/university/MSc Dissertation Presentation
# Marking Criteria (1).pdf. Marked out of 100 on a separate form; the Oral Defence
# criterion above carries it into the dissertation total at /20, i.e. scaled by 5.
# A separate expected deliverable, not an appendix to the written work.
oral_presentation:
  total: 100
  scales_into: Oral Defence /20
  criteria:
  - marks: 10
    criterion_verbatim: Presentation is well structured, with good selection of material
  - marks: 10
    criterion_verbatim: Slides are well prepared with appropriate level of detail
  - marks: 15
    criterion_verbatim: Student displays clear understanding of theoretical foundation of the topic, using
      correct terminology
  - marks: 30
    criterion_verbatim: Student presents own results clearly and correctly
  - marks: 20
    criterion_verbatim: Student is able to answer reasonable questions
  - marks: 10
    criterion_verbatim: Student to articulate future work possible
  - marks: 5
    criterion_verbatim: Clear and correct language is used, both on slides and when presenting
  artefacts:
  - dissertation/oral/OUTLINE.md
  - dissertation/oral/SLIDES.md
  - dissertation/oral/QA_PREP.md

# Module-level facts, VERBATIM from sources/university/CP70073O Dissertation MSG AY25-26.pdf.
# The dissertation is assessed against LO1-LO5; the criteria above are how that is done.
module:
  code: CP70073O
  credits: 60
  level: 7
  partner: UWL RAK Branch Campus
  module_leader: Professor Julie Wall
  module_tutor: Dr H Shaheen
  academic_partner_link_tutor: Dr Parisa Saadati
  external_examiner: Dr Shancang Li, University of Cardiff
  supervisor: Dr Haleema PK

  formative_assessment: >
    "This module does not include a separate formative assessment. Instead, formative
    feedback is provided on an ongoing basis through supervision meetings and feedback on
    draft material submitted to supervisors." There is no poster, logbook, interim report
    or other deliverable beyond the dissertation and the oral presentation.

  learning_outcomes:
    - id: LO1
      text: "Demonstrate independence, self-direction and originality in carrying out a research project"
    - id: LO2
      text: "Demonstrate a deep understanding of the chosen research area/topic, critically evaluate relevant literature, identify key research questions, and formulate research hypothesis in originality"
    - id: LO3
      text: "Creatively design research strategy and research methodology to carry out their research, and make sound justification on the design and implementation"
    - id: LO4
      text: "Critically analyse and synthesise research findings, as well as evaluate and conclude research outcome and impact within the professional, legal, social and ethical framework if applicable"
    - id: LO5
      text: "Demonstrate a systematic understanding of academic writing and presentation, and develop comprehensive skills and techniques on dissertation writing and oral presentation."

  aims:
    - "Investigate and explore in depth an area of interest related to their studies using previously acquired knowledge and extend this knowledge in a selected area or software application."
    - "Produce a significant piece of work focussed on a specific topic that synthesises the academic content of previously studied modules."
    - "Develop a project plan and execute the plan whilst responding to changes and adapting the plan as necessary."
    - "Analyse experimental and other findings from secondary research and to relate them to an appropriate theoretical analysis."
    - "Communicate the work to others by means of appropriate documentation of professional quality."
    - "Analyse, design and implement a software solution to a well-defined problem and document and present the application architecture."

  supervision:
    limit: "Agree a schedule of meetings with the supervisor within the 6hr limit."
    draft_feedback: "At a minimum you can expect informal feedback on one draft per deliverable. You will, however, need to negotiate the timing of submission of these drafts well in advance to fit in with your supervisor's schedule."
    second_reader: >
      "A second reader will be assigned to each student. Their role is to provide formal
      feedback on the deliverables that you submit to the School of Computing and
      Engineering. You should not expect them to act as a second supervisor or ask them to
      provide feedback on drafts of your work."
    marking: "Marked by the supervisor and blind double-marked by another member of staff. May also be marked by the External Examiner. Third marker appointed if the two cannot agree."

  sources_not_yet_obtained:
    - "Dissertation marking rubric and grade descriptors — Blackboard. The only source of the band descriptors (80-100 / 70-79 / 60-69 / 50-59), which are absent from every PDF held here."
    - "Module reading list — Blackboard module area, or UWLReadingLists by module code."


# MSG-mandated document elements. check_structure.py verifies each.
mandated_structure:
  - {id: titlepage,     text: "Title page with declaration including AI", file: dissertation/00_front_matter.md, marker: "including AI"}
  - {id: copyright,     text: "Copyright statement, centred, prescribed wording", file: dissertation/00_front_matter.md, marker: "UK Copyright acts as amended"}
  - {id: abstract,      text: "Abstract, one page", file: dissertation/00_front_matter.md, marker: "## Abstract"}
  - {id: acknowledge,   text: "Acknowledgements, one page", file: dissertation/00_front_matter.md, marker: "## Acknowledgements"}
  - {id: toc,           text: "Table of contents with page numbers", file: dissertation/00_front_matter.md, marker: "## Table of Contents"}
  - {id: introduction,  text: "Introduction", file: dissertation/01_introduction.md, marker: "#"}
  - {id: litreview,     text: "Literature review", file: dissertation/02_literature_review.md, marker: "#"}
  - {id: methods,       text: "Methods", file: dissertation/03_methods.md, marker: "#"}
  - {id: results,       text: "Results and Discussion", file: dissertation/04_results_discussion.md, marker: "#"}
  - {id: conclusion,    text: "Conclusion", file: dissertation/05_conclusion.md, marker: "#"}
  - {id: references,    text: "References, Harvard", file: dissertation/06_references.md, marker: "#"}
  - {id: wordcount,     text: "Stated word count", file: dissertation/00_front_matter.md, marker: "## Word Count"}
  - {id: appendices,    text: "Appendices, numbered sequence", file: dissertation/07_appendices.md, marker: "#"}

# BS 4821 formatting, applied at render time not in source.
formatting:
  paper: "A4, one side"
  font_size: "12pt main text"
  justification: "left justified, NOT fully justified"
  line_spacing: "1.5, except quotations"
  margins: "Left 1.5in; Right 1in; Top and Bottom 1in"
  quotations: indented
  referencing: Harvard

word_budget:
  total_min: 10000
  total_max: 15000
  target: 14000
  chapters:
    dissertation/01_introduction.md: 1300
    dissertation/02_literature_review.md: 2400
    dissertation/03_methods.md: 2600
    dissertation/04_results_discussion.md: 6000
    dissertation/05_conclusion.md: 1200
  tolerance: 0.25
