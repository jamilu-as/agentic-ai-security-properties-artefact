# The thesis as one argument in three movements, encoded so it can be checked.
#
# Capabilities compose non-linearly, so the threat surface cannot be enumerated (RQ1).
# Defences fail non-additively under adaptive attack, so defence-in-depth cannot be
# priced by summing its parts (RQ2). Therefore treatment must be decided per composed
# configuration against a specific adversary (RQ3).
#
# check_coherence.py verifies every link: each RQ has objectives, each objective has a
# chapter and an artefact, and each artefact is consumed somewhere downstream or declared
# terminal.

thesis_claim: >
  Composition is the common failure of enumerative threat modelling and additive
  defence pricing; a viability decision must therefore be taken over a composed
  configuration against a profiled adversary, not over controls in isolation.

research_questions:

  - id: RQ1
    question: >
      Can a capability-derived threat surface model provide more systematic and
      deployment-specific threat characterisation for agentic AI systems
      than enumeration-based approaches?
    status: unchanged from the submitted proposal
    chapter: dissertation/04_results_discussion.md
    objectives:
      - id: O1
        text: "Construct the capability-to-property derivation covering the seven capability clusters and their cross-cluster compositions."
        artefact: A1_threat_surface_model
        marker: "capability-derived"
      - id: O1b
        text: "Test the derivation's procedural determinacy against an enumerative baseline by inter-rater agreement, and its predictive validity against the attack outcomes produced under RQ2."
        artefact: A1b_derivation_instrument
        marker: "predictive validity"
      - id: O2
        text: "Benchmark coverage per property. Paper 1 Table 1 already delivers this; the work is verification against the 2026 landscape, correcting the peer-agents row, and adding agent extensibility as a seventh cluster with Skill-Inject as its first dedicated benchmark."
        artefact: A2_coverage_audit
        marker: "coverage"
    consumed_by:
      - target: RQ2
        how: "The derived surface identifies which properties the RQ2 deployment puts at risk, and therefore which defence axes are candidates. States what the study is a study OF."
        marker_in: dissertation/03_methods.md
        marker: "threat surface"
      - target: RQ3
        how: "The threat-actor profile passes the applicability gate that conditions which viability forces apply."
        marker_in: dissertation/04_results_discussion.md
        marker: "threat-actor profile"

  - id: RQ2
    question: >
      Do current security controls for agentic AI systems maintain their claimed
      security properties when composed and evaluated against adversarially optimised
      attack conditions?
    status: "revised - composition scoping clause added; see plan/REFRAMING.md"
    chapter: dissertation/04_results_discussion.md
    objectives:

      - id: O3
        text: "Establish whether defences drawn from different design axes can be composed at all, and report the mechanism where they cannot. Restated 29 Aug 2026 when the confirmatory factorial was withdrawn before collection; prereg amendment 2."
        artefact: A3_composition_harness
        marker: "composed"
      - id: O4
        text: "Establish whether a multiplicative benchmark can identify correlated failure at the effectiveness these defences exhibit. Restated 29 Aug 2026; see O3."
        artefact: A4_correlated_failure_result
        marker: "attainable"
    consumed_by:
      - target: RQ3
        how: "Supplies the measured inputs the viability framework prices: adaptive lift (scientific force), utility tax (engineering force), cost per security gain (economic force)."
        marker_in: dissertation/04_results_discussion.md
        marker: "measured"
    depends_on:
      - source: RQ1
        how: "The defence axes evaluated are those the derived surface identifies as candidates for the properties at risk."

  - id: RQ3
    question: >
      What scientific, engineering, and economic constraints govern the viability of
      security controls for agentic AI, and how do these constraints determine
      appropriate risk treatment decisions?
    status: unchanged from the submitted proposal
    chapter: dissertation/04_results_discussion.md
    objectives:
      - id: O5
        text: "Operationalise the three forces as measurable per-control properties and map viability profiles to ISO 31000 treatments."
        artefact: A5_viability_framework
        marker: "ISO 31000"
      - id: O6b
        text: "Test the decision rule's determinacy, ordering validity against measured cost-effectiveness, and stability under bootstrap propagation of its own inputs."
        artefact: A6b_viability_instrument
        marker: "decision stability"
      - id: O6
        text: "Amend the framework for COMPOSED controls, and apply the decision rule to two deployment contexts using measured values."
        artefact: A6_treatment_decisions
        marker: "treatment"
    depends_on:
      - source: RQ1
        how: "The threat-actor profile determines which forces apply and how the scientific force is graded."
      - source: RQ2
        how: "Measured adaptive lift, utility tax and cost ratios replace Paper 1 Table 2's illustrative cells."

# The integration test. This is what turns three chapters into one thesis, and it is
# the only claim in the document that no single RQ can make on its own.
integration:
  claim: >
    The three instruments compose. Holding the measured RQ2 data fixed and varying only
    the RQ1 threat-actor profile flips at least one ISO 31000 treatment decision - which
    demonstrates the applicability gate does real work rather than being asserted.
  chapter: dissertation/04_results_discussion.md
  marker: "applicability gate"
  falsifiable: >
    If no profile change flips any treatment, the gate is inert on this dataset and the
    composition is decorative. Report that plainly - it is a finding about the framework.
  note: >
    Paper 1 section 5 composes the two instruments on illustrative values, stating that
    they are "not externally validated outcomes". This test supplies measured values.

