  - {id: A2_coverage_audit,           chapter: dissertation/04_results_discussion.md, rubric: "new methodology"}
  - {id: ,       chapter: dissertation/04_results_discussion.md,   rubric: "new methodology"}
  - {id: A3_composition_harness,      chapter: dissertation/03_methods.md,              rubric: "software artefact"}
  - {id: A4_correlated_failure_result,chapter: dissertation/04_results_discussion.md,   rubric: "new theory / methodology"}
  - {id: A5_viability_framework,      chapter: dissertation/04_results_discussion.md,  rubric: "conceptual/analytic model"}
  - {id: A6b_viability_instrument, chapter: dissertation/04_results_discussion.md, rubric: "software artefact"}
  - {id: A6_treatment_decisions,      chapter: dissertation/04_results_discussion.md,  rubric: "applied result", terminal: true}

# Ch7 must map every objective to where it was met - the rubric asks for this explicitly
