# Questions no script can settle.
#
# The mechanical checks test strings. Every one of them names a semantic property
# and verifies a proxy for it: check_register tests whether a marker appears, not
# whether the point is made; check_coherence tests whether objective markers exist,
# not whether the argument holds. Both have been wrong in both directions.
#
# This register holds the judgements that require reading. Each names what to read,
# the question, and the agent that owns it. A verdict is recorded WITH the hash of
# what was read, so it expires when the text changes - a ruling on a paragraph that
# has since been rewritten is not a ruling.
#
# verdict: open | pass | fail | null (never ruled on)
# Record verdicts with `checks/rule.py <id> <pass|fail|open> "<finding>"`.

judgements:

  # ---- argument and structure -----------------------------------------------
  - id: J01
    question: Does Chapter 2 pose an open question that RQ1 answers, so that the derivation model, the coverage audit and O1b are motivated before they appear?
    read: [dissertation/02_literature_review.md, dissertation/01_introduction.md]
    owner: coherence-reader
    verdict: fail
    finding: "2.7 names three open questions and assigns them to RQ2 and RQ3 only. RQ1 has no stated gap; nothing in Ch2 motivates the derivation model."
    verified_against: null

  - id: J02
    question: Is the RQ1 strand synthesised or enumerated in 2.2? The comparative artefact that would evidence synthesis currently sits in Chapter 4.
    read: [dissertation/02_literature_review.md]
    owner: coherence-reader
    verdict: fail
    finding: "Six capabilities, one sentence each, synthesis arriving after the list. Ch2 enumerates and Ch4 synthesises, which is the wrong way round for marks awarded inside the Literature Review."
    verified_against: null

  - id: J03
