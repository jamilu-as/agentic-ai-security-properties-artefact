    read: [dissertation/03_methods.md, dissertation/02_literature_review.md, dissertation/06_references.md]
    owner: evidence-auditor
    verdict: fail
    finding: "Disjunction cannot fail, and 3 of 4 instances carry no citation by which either limb could be checked. Weakened from the proposal's 'peer-reviewed at a top venue'."
    verified_against: null

  - id: J06
    question: Is the utility gate applied where utility actually collapses? The floor check is per-arm on the undefended configuration only.
    read: [dissertation/03_methods.md, preregistration/PREREGISTRATION.md]
    owner: external-examiner
    verdict: fail
    finding: "Triple-defence cell is where utility collapses; a crippled agent cannot reach the injection's goal either, giving spurious rho* < 1. Cuts against the hypothesis, which is why it is credible."
    verified_against: null

