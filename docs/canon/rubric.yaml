# CP70073O marking criteria.
#
# PROVENANCE — three different things are recorded here, and they are not equally
# authoritative. Do not let the third read as the first.
#
#   `criteria`             VERBATIM from sources/university/MSc Dissertation Marking
#                          Criteria (1).pdf. Names, descriptors and sub-weightings are
#                          quoted exactly. The rubric is criterion-based and says
#                          NOTHING about chapters, ordering, or which chapter carries
#                          which criterion.
#   `mandated_structure`   VERBATIM requirement list from the MSG (a different
#                          document), which does specify the chapter sequence.
#   `evidence`, `must_contain`, `word_budget`
#                          OUR MAPPING. Not from either source. A working assignment of
#                          where each criterion's evidence is expected to appear, used
#                          to drive check_rubric_trace.py. Markers award against criteria
#                          wherever the evidence is found, so this is a drafting aid, not
#                          a constraint the university imposes.
#
# Notably inferred: Analysis and Conclusions (15) is split here as one 5-mark block in
# the Results chapter (critical evaluation of results) and two in the Conclusion
# (contributions; limitations and future work). The rubric states the three blocks and
# does not say where they appear.
#
# check_rubric_trace.py fails if any criterion has no non-stub evidence file.
total: 100
criteria:
- id: aims
  name: Aims and Objectives
  marks: 10
  descriptor_verbatim: Background and context of the research area / topic well introduced. Research question(s)
    clearly defined, and appropriate for Master level. (5) Aims and objectives clearly defined; hypothesis
    well-formulated; expected research output and deliverables are specific, measurable and achievable.
    (5)
  sub:
  - marks: 5
    text: Background and context of the research area / topic well introduced. Research question(s) clearly
      defined, and appropriate for Master level.
  - marks: 5
    text: Aims and objectives clearly defined; hypothesis well-formulated; expected research output and
      deliverables are specific, measurable and achievable.
  evidence:
  - dissertation/01_introduction.md
  must_contain:
  - hypothesis
  - objective
  - research question
  - deliverable
- id: litreview
  name: Literature Review
  marks: 10
  descriptor_verbatim: In-depth and quality review of related work supported by sufficient, appropriate
    and relevant literature. (5) Gap analysis and motivation / importance of proposed research well addressed
    through analysis, evaluation and synthesis of related literature. (5)
  sub:
  - marks: 5
    text: In-depth and quality review of related work supported by sufficient, appropriate and relevant
      literature.
  - marks: 5
    text: Gap analysis and motivation / importance of proposed research well addressed through analysis,
      evaluation and synthesis of related literature.
  evidence:
  - dissertation/02_literature_review.md
  must_contain:
  - gap
  - since literature review
- id: methods
  name: Methodology and Approach
  marks: 10
  descriptor_verbatim: Research design and process described in detail (e.g. experiment design, survey
    / interview design, data collection, procedure description, etc.) (5) Chosen method/approach well-articulated
    and justified in the specific context of the research. (5)
  sub:
  - marks: 5
    text: Research design and process described in detail (e.g. experiment design, survey / interview
      design, data collection, procedure description, etc.)
  - marks: 5
    text: Chosen method/approach well-articulated and justified in the specific context of the research.
  evidence:
  - dissertation/03_methods.md
  must_contain:
  - justif
  - pre-registration
  - AutoDojo
  - ethic
- id: results
  name: Results and Findings
  marks: 35
  descriptor_verbatim: Presence and evidence of main research output (e.g. new theory, design and methodology,
    new technical solutions such as algorithms, architectures, conceptual / analytic models, software
    artefacts, etc.) (20) Statement and description of data collected and results; descriptive summary
    of findings. (15)
  sub:
  - marks: 20
    text: Presence and evidence of main research output (e.g. new theory, design and methodology, new
      technical solutions such as algorithms, architectures, conceptual / analytic models, software artefacts,
      etc.)
  - marks: 15
    text: Statement and description of data collected and results; descriptive summary of findings.
  evidence:
  - dissertation/04_results_discussion.md
  must_contain:
  - Research output
  - Table
  - Figure
- id: analysis
  name: Analysis and Conclusions
  marks: 15
  descriptor_verbatim: Summary of contributions; sound conclusions drawn and supported by analysis. (5)
    Critical analysis, exploration and evaluation of data collected / results generated. (5) Limitation
    and implication / impact of research discussed. Reflection and identification of improvements / future
    work. (5)
  sub:
  - marks: 5
    text: Summary of contributions; sound conclusions drawn and supported by analysis.
  - marks: 5
    text: Critical analysis, exploration and evaluation of data collected / results generated.
  - marks: 5
    text: Limitation and implication / impact of research discussed. Reflection and identification of
      improvements / future work.
  evidence:
  - dissertation/04_results_discussion.md
  - dissertation/05_conclusion.md
  must_contain:
  - limitation
  - future work
  - contribution
- id: oral
  name: Oral Defence
  marks: 20
  descriptor_verbatim: Oral presentation given by the student and Q&A conducted (separate marking form).
  evidence:
  - dissertation/oral/OUTLINE.md
  must_contain:
  - future work
  - results

# MSG-mandated document elements. check_structure.py verifies each.
mandated_structure:
  - {id: titlepage,     text: "Title page with declaration including AI", file: dissertation/00_front_matter.md, marker: "including AI"}
  - {id: copyright,     text: "Copyright statement, centred, prescribed wording", file: dissertation/00_front_matter.md, marker: "UK Copyright acts as amended"}
  - {id: abstract,      text: "Abstract, one page", file: dissertation/00_front_matter.md, marker: "## Abstract"}
  - {id: acknowledge,   text: "Acknowledgements, one page", file: dissertation/00_front_matter.md, marker: "## Acknowledgements"}
  - {id: toc,           text: "Table of contents with page numbers", file: dissertation/00_front_matter.md, marker: "## Table of Contents"}
  - {id: introduction,  text: "Introduction", file: dissertation/01_introduction.md, marker: "#"}
  - {id: litreview,     text: "Literature review", file: dissertation/02_literature_review.md, marker: "#"}
  - {id: methods,       text: "Methods", file: dissertation/03_methods.md, marker: "#"}
  - {id: results,       text: "Results and Discussion", file: dissertation/04_results_discussion.md, marker: "#"}
  - {id: conclusion,    text: "Conclusion", file: dissertation/05_conclusion.md, marker: "#"}
  - {id: references,    text: "References, Harvard", file: dissertation/06_references.md, marker: "#"}
  - {id: wordcount,     text: "Stated word count", file: dissertation/00_front_matter.md, marker: "## Word Count"}
  - {id: appendices,    text: "Appendices, numbered sequence", file: dissertation/07_appendices.md, marker: "#"}

# BS 4821 formatting, applied at render time not in source.
formatting:
  paper: "A4, one side"
  font_size: "12pt main text"
  justification: "left justified, NOT fully justified"
  line_spacing: "1.5, except quotations"
  margins: "Left 1.5in; Right 1in; Top and Bottom 1in"
  quotations: indented
  referencing: Harvard

word_budget:
  total_min: 10000
  total_max: 15000
  target: 14000
  chapters:
    dissertation/01_introduction.md: 1300
    dissertation/02_literature_review.md: 2400
    dissertation/03_methods.md: 2600
    dissertation/04_results_discussion.md: 6000
    dissertation/05_conclusion.md: 1200
  tolerance: 0.25
