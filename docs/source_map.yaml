# What the submitted work becomes.
#
# The literature review (10,138 words, graded) and proposal (8,776 words, graded)
# are the foundation, not background. Against a 14,000-word dissertation, most of
# the non-empirical text derives from them. This file records the disposition of
# every section so nothing valuable is silently dropped and nothing stale is
# silently carried.
#
# disposition:
#   reuse    - transfers substantially as written
#   condense - transfers compressed; the source is longer than the chapter allows
#   update   - transfers but the content moved after the 14 May 2026 cut-off
#   amend    - transfers but the ARGUMENT changes (composition reframe)
#   retire   - does not transfer; must have a reason
#
# check_sources.py fails if a section has no disposition, or if a non-retired
# section's target chapter is complete but does not carry its marker.

title:
  submitted: "An Empirical and Analytical Study of Security Properties in Agentic AI System"
  ethics_form: "An Empirical and Analytical Study of Security Properties in Agentic AI Systems"
  use: "Agentic AI Systems (plural)"
  note: >
    The signed ethics form of 2 May 2026 has the plural; the proposal and literature
    review both carry the singular. The plural is correct English and predates both
    submissions. Use it, and note the correspondence once in the front matter.
  status: UNCHANGED
  rationale: >
    Survives the composition reframe without alteration. "Empirical" is RQ2;
    "Analytical" is RQ1 and RQ3; "Security Properties" is the LR Table 1
    capability-derived vocabulary the whole argument hangs on. One less
    declarable change.

